<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Going Cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed136" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fed136" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed136"/>
      <stop offset="1" stop-color="#e6bc2f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- Cloud -->
  <g transform="translate(440 90)">
    <path d="M120 180
             a90 90 0 0 1 84 -118
             a110 110 0 0 1 200 18
             a72 72 0 0 1 88 70
             a64 64 0 0 1 -56 64
             H110
             a72 72 0 0 1 10 -34z"
          fill="url(#cloudFill)" opacity=".95"/>
    <!-- subtle highlight -->
    <path d="M180 90 a70 70 0 0 1 130 8" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    <!-- Up arrow inside cloud -->
    <g transform="translate(245 78)" stroke="#1f2933" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 100 L50 30"/>
      <path d="M20 60 L50 30 L80 60"/>
    </g>
  </g>

  <!-- Connection lines from cloud to nodes -->
  <g stroke="#fed136" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6" fill="none" stroke-linecap="round">
    <path d="M560 360 C 560 480, 320 460, 280 560"/>
    <path d="M640 360 L 640 540"/>
    <path d="M720 360 C 720 480, 960 460, 1000 560"/>
  </g>

  <!-- Server / node 1 (left) -->
  <g transform="translate(200 540)">
    <rect width="160" height="120" rx="12" fill="#0f1620" stroke="#2a2f37" stroke-width="2"/>
    <rect x="14" y="18" width="132" height="22" rx="4" fill="#1a2230"/>
    <circle cx="26" cy="29" r="4" fill="#27c93f"/>
    <rect x="42" y="25" width="80" height="8" rx="2" fill="#2a3340"/>
    <rect x="14" y="50" width="132" height="22" rx="4" fill="#1a2230"/>
    <circle cx="26" cy="61" r="4" fill="#fed136"/>
    <rect x="42" y="57" width="60" height="8" rx="2" fill="#2a3340"/>
    <rect x="14" y="82" width="132" height="22" rx="4" fill="#1a2230"/>
    <circle cx="26" cy="93" r="4" fill="#27c93f"/>
    <rect x="42" y="89" width="70" height="8" rx="2" fill="#2a3340"/>
  </g>

  <!-- Container / node 2 (middle) -->
  <g transform="translate(560 540)">
    <rect width="160" height="120" rx="12" fill="#0f1620" stroke="#fed136" stroke-opacity=".4" stroke-width="2"/>
    <g transform="translate(40 28)" fill="none" stroke="#fed136" stroke-width="3" stroke-linejoin="round">
      <!-- container icon -->
      <rect x="0" y="20" width="80" height="44" rx="4"/>
      <rect x="10" y="6" width="60" height="14" rx="2"/>
      <line x1="20" y1="34" x2="20" y2="50"/>
      <line x1="40" y1="34" x2="40" y2="50"/>
      <line x1="60" y1="34" x2="60" y2="50"/>
    </g>
    <text x="80" y="104" text-anchor="middle" fill="#9bb1c2" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="1.5">CONTAINER</text>
  </g>

  <!-- Database / node 3 (right) -->
  <g transform="translate(920 540)">
    <rect width="160" height="120" rx="12" fill="#0f1620" stroke="#2a2f37" stroke-width="2"/>
    <g transform="translate(50 22)" fill="none" stroke="#fed136" stroke-width="3">
      <ellipse cx="30" cy="10" rx="30" ry="8"/>
      <path d="M0 10 V40 a30 8 0 0 0 60 0 V10"/>
      <path d="M0 40 V70 a30 8 0 0 0 60 0 V40" />
      <path d="M0 25 a30 8 0 0 0 60 0"/>
    </g>
    <text x="80" y="108" text-anchor="middle" fill="#9bb1c2" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="1.5">DATA</text>
  </g>
</svg>
