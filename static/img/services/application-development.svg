<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Application Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed136" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fed136" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- IDE-style window -->
  <g transform="translate(180 130)">
    <rect width="920" height="460" rx="18" fill="#0f1620" stroke="#2a2f37" stroke-width="2"/>
    <rect width="920" height="44" rx="18" fill="#1a2230"/>
    <rect y="30" width="920" height="14" fill="#1a2230"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <rect x="120" y="14" width="180" height="16" rx="4" fill="#2a2f37"/>

    <!-- Sidebar -->
    <rect x="0" y="44" width="190" height="416" fill="#131b25"/>
    <g fill="#52606d" font-family="ui-monospace,Menlo,monospace" font-size="13">
      <rect x="22" y="74" width="120" height="8" rx="2" fill="#2a3340"/>
      <rect x="22" y="98" width="100" height="8" rx="2" fill="#2a3340"/>
      <rect x="36" y="122" width="120" height="8" rx="2" fill="#2a3340"/>
      <rect x="36" y="146" width="80" height="8" rx="2" fill="#fed136" fill-opacity=".55"/>
      <rect x="36" y="170" width="110" height="8" rx="2" fill="#2a3340"/>
      <rect x="22" y="206" width="90" height="8" rx="2" fill="#2a3340"/>
      <rect x="36" y="230" width="120" height="8" rx="2" fill="#2a3340"/>
      <rect x="36" y="254" width="100" height="8" rx="2" fill="#2a3340"/>
    </g>

    <!-- Code body -->
    <g transform="translate(220 70)" font-family="ui-monospace,Menlo,monospace" font-size="14">
      <text fill="#52606d">1</text>
      <text x="34" fill="#c792ea">public class</text>
      <text x="160" fill="#82aaff">PaymentService</text>
      <text x="298" fill="#e6edf3">{</text>

      <text y="32" fill="#52606d">2</text>
      <text x="34" y="32" fill="#52606d">  // strongly typed, well tested</text>

      <text y="64" fill="#52606d">3</text>
      <text x="34" y="64" fill="#c792ea">  @Transactional</text>

      <text y="96" fill="#52606d">4</text>
      <text x="34" y="96" fill="#c792ea">  public</text>
      <text x="92" y="96" fill="#82aaff">Result&lt;Receipt&gt;</text>
      <text x="232" y="96" fill="#fed136">charge</text>
      <text x="290" y="96" fill="#e6edf3">(</text>
      <text x="298" y="96" fill="#82aaff">Order</text>
      <text x="346" y="96" fill="#e6edf3">o)</text>

      <text y="128" fill="#52606d">5</text>
      <text x="34" y="128" fill="#e6edf3">  {</text>

      <text y="160" fill="#52606d">6</text>
      <text x="34" y="160" fill="#e6edf3">    return</text>
      <text x="106" y="160" fill="#fed136">gateway</text>
      <text x="172" y="160" fill="#e6edf3">.</text>
      <text x="180" y="160" fill="#fed136">authorize</text>
      <text x="262" y="160" fill="#e6edf3">(o)</text>

      <text y="192" fill="#52606d">7</text>
      <text x="34" y="192" fill="#e6edf3">      .</text>
      <text x="68" y="192" fill="#fed136">map</text>
      <text x="100" y="192" fill="#e6edf3">(</text>
      <text x="108" y="192" fill="#82aaff">Receipt</text>
      <text x="174" y="192" fill="#e6edf3">::of);</text>

      <text y="224" fill="#52606d">8</text>
      <text x="34" y="224" fill="#e6edf3">  }</text>

      <text y="256" fill="#52606d">9</text>
      <text x="34" y="256" fill="#e6edf3">}</text>

      <!-- Test pass row -->
      <g transform="translate(0 300)">
        <rect width="660" height="30" rx="6" fill="#0a1018" stroke="#1f2933"/>
        <circle cx="18" cy="15" r="6" fill="#27c93f"/>
        <text x="34" y="20" fill="#9bb1c2" font-family="ui-monospace,Menlo,monospace" font-size="13">
          BUILD SUCCESS · 248 tests passed · coverage 92%
        </text>
      </g>
      <g transform="translate(0 340)">
        <rect width="660" height="30" rx="6" fill="#0a1018" stroke="#1f2933"/>
        <circle cx="18" cy="15" r="6" fill="#fed136"/>
        <text x="34" y="20" fill="#9bb1c2" font-family="ui-monospace,Menlo,monospace" font-size="13">
          deploy → staging  ·  release v3.14.0
        </text>
      </g>
    </g>
  </g>
</svg>
