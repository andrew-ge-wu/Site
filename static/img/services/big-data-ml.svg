<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Big Data and Machine Learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed136" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fed136" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <radialGradient id="node" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fed136"/>
      <stop offset="1" stop-color="#e6bc2f"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- Neural network: input (5) -> hidden (8) -> hidden (8) -> output (3) -->
  <g stroke-linecap="round">
    <!-- edges (drawn first) -->
    <g stroke="#fed136" stroke-opacity=".18" stroke-width="1.2">
      <!-- input → hidden1 -->
      <g>
        <line x1="220" y1="180" x2="500" y2="140"/>
        <line x1="220" y1="180" x2="500" y2="220"/>
        <line x1="220" y1="180" x2="500" y2="300"/>
        <line x1="220" y1="280" x2="500" y2="140"/>
        <line x1="220" y1="280" x2="500" y2="220"/>
        <line x1="220" y1="280" x2="500" y2="300"/>
        <line x1="220" y1="280" x2="500" y2="380"/>
        <line x1="220" y1="380" x2="500" y2="220"/>
        <line x1="220" y1="380" x2="500" y2="300"/>
        <line x1="220" y1="380" x2="500" y2="380"/>
        <line x1="220" y1="380" x2="500" y2="460"/>
        <line x1="220" y1="480" x2="500" y2="380"/>
        <line x1="220" y1="480" x2="500" y2="460"/>
        <line x1="220" y1="480" x2="500" y2="540"/>
        <line x1="220" y1="580" x2="500" y2="460"/>
        <line x1="220" y1="580" x2="500" y2="540"/>
      </g>
      <!-- hidden1 → hidden2 -->
      <g>
        <line x1="500" y1="140" x2="780" y2="180"/>
        <line x1="500" y1="140" x2="780" y2="280"/>
        <line x1="500" y1="220" x2="780" y2="180"/>
        <line x1="500" y1="220" x2="780" y2="280"/>
        <line x1="500" y1="220" x2="780" y2="380"/>
        <line x1="500" y1="300" x2="780" y2="280"/>
        <line x1="500" y1="300" x2="780" y2="380"/>
        <line x1="500" y1="380" x2="780" y2="380"/>
        <line x1="500" y1="380" x2="780" y2="480"/>
        <line x1="500" y1="460" x2="780" y2="380"/>
        <line x1="500" y1="460" x2="780" y2="480"/>
        <line x1="500" y1="460" x2="780" y2="580"/>
        <line x1="500" y1="540" x2="780" y2="480"/>
        <line x1="500" y1="540" x2="780" y2="580"/>
      </g>
      <!-- hidden2 → output -->
      <g stroke-opacity=".35">
        <line x1="780" y1="180" x2="1060" y2="260"/>
        <line x1="780" y1="280" x2="1060" y2="260"/>
        <line x1="780" y1="280" x2="1060" y2="360"/>
        <line x1="780" y1="380" x2="1060" y2="360"/>
        <line x1="780" y1="480" x2="1060" y2="360"/>
        <line x1="780" y1="480" x2="1060" y2="460"/>
        <line x1="780" y1="580" x2="1060" y2="460"/>
      </g>
    </g>
  </g>

  <!-- nodes -->
  <g>
    <!-- input -->
    <g fill="#9bb1c2">
      <circle cx="220" cy="180" r="14"/>
      <circle cx="220" cy="280" r="14"/>
      <circle cx="220" cy="380" r="14"/>
      <circle cx="220" cy="480" r="14"/>
      <circle cx="220" cy="580" r="14"/>
    </g>
    <!-- hidden 1 -->
    <g fill="#52606d">
      <circle cx="500" cy="140" r="16"/>
      <circle cx="500" cy="220" r="16"/>
      <circle cx="500" cy="300" r="16"/>
      <circle cx="500" cy="380" r="16"/>
      <circle cx="500" cy="460" r="16"/>
      <circle cx="500" cy="540" r="16"/>
    </g>
    <!-- hidden 2 -->
    <g fill="#52606d">
      <circle cx="780" cy="180" r="16"/>
      <circle cx="780" cy="280" r="16"/>
      <circle cx="780" cy="380" r="16"/>
      <circle cx="780" cy="480" r="16"/>
      <circle cx="780" cy="580" r="16"/>
    </g>
    <!-- output -->
    <g>
      <circle cx="1060" cy="260" r="20" fill="url(#node)"/>
      <circle cx="1060" cy="360" r="20" fill="url(#node)"/>
      <circle cx="1060" cy="460" r="20" fill="url(#node)"/>
    </g>
  </g>

  <!-- Data stream bars (top-right) -->
  <g transform="translate(960 80)" fill="#fed136" fill-opacity=".7">
    <rect x="0" y="40" width="6" height="30" rx="2"/>
    <rect x="14" y="20" width="6" height="50" rx="2"/>
    <rect x="28" y="34" width="6" height="36" rx="2"/>
    <rect x="42" y="6"  width="6" height="64" rx="2"/>
    <rect x="56" y="22" width="6" height="48" rx="2"/>
    <rect x="70" y="38" width="6" height="32" rx="2"/>
    <rect x="84" y="14" width="6" height="56" rx="2"/>
    <rect x="98" y="28" width="6" height="42" rx="2"/>
    <rect x="112" y="2" width="6" height="68" rx="2"/>
    <rect x="126" y="20" width="6" height="50" rx="2"/>
    <rect x="140" y="44" width="6" height="26" rx="2"/>
    <rect x="154" y="10" width="6" height="60" rx="2"/>
  </g>

  <!-- Layer labels -->
  <g fill="#52606d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">
    <text x="220" y="650">INPUT</text>
    <text x="500" y="650">HIDDEN</text>
    <text x="780" y="650">HIDDEN</text>
    <text x="1060" y="650">OUTPUT</text>
  </g>
</svg>
