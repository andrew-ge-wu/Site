<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="AI tooling at scale across multiple engineering teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1620"/>
      <stop offset="1" stop-color="#1f2933"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2a3340" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fed136" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fed136" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".5"/>
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- Center: Claude / standard tooling hub -->
  <g transform="translate(800 450)">
    <circle r="120" fill="#0f1620" stroke="#fed136" stroke-width="3"/>
    <circle r="120" fill="none" stroke="#fed136" stroke-width="1" stroke-dasharray="4 6" opacity=".55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fed136" letter-spacing="2">CLAUDE</text>
    <text x="0" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cdd5df" letter-spacing="1">STANDARD TOOLING</text>
    <text x="0" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a8694" letter-spacing="3">CONTEXT · POLICY · GUARDRAILS</text>
  </g>

  <!-- Spokes to 6 teams -->
  <g stroke="#fed136" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7" fill="none">
    <line x1="800" y1="450" x2="280" y2="200"/>
    <line x1="800" y1="450" x2="1320" y2="200"/>
    <line x1="800" y1="450" x2="180" y2="450"/>
    <line x1="800" y1="450" x2="1420" y2="450"/>
    <line x1="800" y1="450" x2="280" y2="700"/>
    <line x1="800" y1="450" x2="1320" y2="700"/>
  </g>

  <!-- Team nodes -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1620" letter-spacing="1">
    <g transform="translate(280 200)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#fed136"/>
      <text x="0" y="-6" text-anchor="middle">PLATFORM</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#1f2933">infra · CI · SDKs</text>
    </g>
    <g transform="translate(1320 200)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#fed136"/>
      <text x="0" y="-6" text-anchor="middle">ML / DATA</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#1f2933">models · pipelines</text>
    </g>
    <g transform="translate(180 450)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#0f1620" stroke="#fed136" stroke-width="2"/>
      <text x="0" y="-6" text-anchor="middle" fill="#fed136">PRODUCT A</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#cdd5df">Java · Spring</text>
    </g>
    <g transform="translate(1420 450)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#0f1620" stroke="#fed136" stroke-width="2"/>
      <text x="0" y="-6" text-anchor="middle" fill="#fed136">PRODUCT B</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#cdd5df">Kotlin · GraphQL</text>
    </g>
    <g transform="translate(280 700)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#0f1620" stroke="#fed136" stroke-width="2"/>
      <text x="0" y="-6" text-anchor="middle" fill="#fed136">FRONTEND</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#cdd5df">React · TS</text>
    </g>
    <g transform="translate(1320 700)">
      <rect x="-100" y="-32" width="200" height="64" rx="8" fill="#0f1620" stroke="#fed136" stroke-width="2"/>
      <text x="0" y="-6" text-anchor="middle" fill="#fed136">RISK / FRAUD</text>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#cdd5df">Python · Go</text>
    </g>
  </g>

  <!-- Top-left badge -->
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#fed136"/>
    <text x="22" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" letter-spacing="2">AI · AT · ENTERPRISE · SCALE</text>
  </g>

  <!-- Bottom caption -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#cdd5df" letter-spacing="3">
    <text x="60" y="850" font-size="14" opacity=".75">ONE TOOLCHAIN  ·  N TEAMS  ·  CONSISTENT QUALITY</text>
    <text x="1540" y="850" text-anchor="end" font-size="12" fill="#fed136" opacity=".9">circuitwall.net</text>
  </g>
</svg>
