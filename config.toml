languageCode = "en-us"
title = "CircuitWall Consultancy"
theme = "landing-page"
baseurl = "https://circuitwall.net"

# SEO and Performance optimizations
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Minification for production
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

# Image processing
[imaging]
  quality = 85
  resampleFilter = "lanczos"

[params]
    name = "Andrew Wu"
    
    # SEO improvements
    description = "Expert Java, Spring, JVM performance tuning, big data, real-time processing and machine learning consultancy by Andrew Wu in Stockholm, Sweden."
    keywords = "Java consultancy, Spring Framework, JVM performance, big data, machine learning, MLOps, Stockholm consultant"
    author = "Andrew Wu"
    
    # Original params
    subtitle = "A Java, Spring, JVM performance tuning, bigdata, realtime processing and machine learning consultancy."
    buttonText = "Find out more"
    favicon = "static/favicon.ico"
    ignoreLogs = ['warning-goldmark-raw-html']
    
    # Custom CSS files
    custom_css = ["css/performance.css"]

[[params.social]]
    title = "email"
    icon = "envelope-o"
    url = "mailto:contact@circuitwall.net"
[[params.social]]
    title = "github"
    icon = "github"
    url = "https://github.com/CircuitWall"
[[params.social]]
    title = "linkedin"
    icon = "linkedin"
    url = "http://se.linkedin.com/in/andrew-wu-ba92b921"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
