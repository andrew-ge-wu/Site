defaultContentLanguage = "en"
title = "CircuitWall"
theme = "landing-page"
baseurl = "https://circuitwall.net"

# SEO and Performance optimizations
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Minification for production
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

# Image processing
[imaging]
  quality = 85
  resampleFilter = "lanczos"

[params]
    name = "Andrew Wu"
    
    # SEO improvements
    description = "Java, Spring, JVM performance tuning, big data, real-time processing and machine learning notes by Andrew Wu in Stockholm, Sweden."
    keywords = "Java, Spring Framework, JVM performance, big data, machine learning, MLOps, Stockholm"
    author = "Andrew Wu"
    
    # Original params
    subtitle = "Java, Spring, JVM performance tuning, big data, real-time processing and machine learning."
    banner_subtitle = "Java, Spring, JVM performance tuning, big data, real-time processing and machine learning."
    buttonText = "Find out more"
    favicon = "static/favicon.ico"
    ignoreLogs = ['warning-goldmark-raw-html']
    
    # Custom CSS files
    custom_css = ["css/performance.css"]

[[params.social]]
    title = "email"
    icon = "envelope-o"
    url = "mailto:contact@circuitwall.net"
[[params.social]]
    title = "github"
    icon = "github"
    url = "https://github.com/CircuitWall"
[[params.social]]
    title = "linkedin"
    icon = "linkedin"
    url = "http://se.linkedin.com/in/andrew-wu-ba92b921"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.highlight]
    style = "github-dark"
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = false
    tabWidth = 4

[related]
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10

# Module mounts: also expose static/img as an asset for Hugo Pipes (image processing)
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"
