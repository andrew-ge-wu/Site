{{- $u := urls.Parse .Destination -}}
{{- $isExternal := and $u.Scheme (ne $u.Host (urls.Parse .Page.Site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $isExternal }} target="_blank" rel="noopener noreferrer external"{{ end }}>{{ .Text | safeHTML }}</a>
